# render.yaml — BookBrief AI deployment on Render.com
# Docs: https://render.com/docs/render-yaml-ref
#
# Services defined here:
#   1. bookbrief-web     — FastAPI web service (uvicorn)
#   2. bookbrief-db      — Managed PostgreSQL (Render Postgres)
#
# Deploy: connect this repo in the Render dashboard → "New Blueprint"
# All env vars marked sync: false must be set manually in the Render dashboard.

databases:
  - name: bookbrief-db
    databaseName: bookbrief
    user: bookbrief
    # Legacy Postgres plans (e.g. starter) cannot be used for *new* databases — see Render Blueprint DB `plan` docs.
    plan: basic-256mb

services:
  - type: web
    name: bookbrief-web
    runtime: python
    region: oregon         # or: frankfurt, singapore, ohio
    plan: starter          # upgrade to standard for production

    # ── Build ──────────────────────────────────────────────────────────────
    rootDir: bookbrief-ai/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # ── Start (migrations run here so DATABASE_URL is available) ──────────
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --loop uvloop --http httptools --proxy-headers --forwarded-allow-ips='*'

    # ── Health check ───────────────────────────────────────────────────────
    healthCheckPath: /api/v1/health

    # ── Auto-deploy on push to main ────────────────────────────────────────
    autoDeploy: true

    # ── Environment variables ──────────────────────────────────────────────
    envVars:
      # Injected automatically by Render
      - key: DATABASE_URL
        fromDatabase:
          name: bookbrief-db
          property: connectionString

      # Set in Render dashboard — never commit real values here
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false

      # Non-secret config — safe to set here
      - key: DEBUG
        value: "false"
      - key: OPENROUTER_SUMMARY_MODEL
        value: "google/gemma-4-26b-a4b-it"
      - key: SUMMARY_LLM_TIMEOUT_SECONDS
        value: "50"
      - key: SUMMARY_MAX_INPUT_CHARS
        value: "28000"
      - key: OPENROUTER_PODCAST_MODEL
        value: "openai/gpt-4o-mini"
      - key: OPENROUTER_TTS_MODEL
        value: "openai/tts-1"
      - key: OPENROUTER_VIDEO_MODEL
        value: "google/veo-3.1-lite"
      - key: OPENROUTER_VIDEO_DURATION
        value: "90"
      - key: OPENROUTER_VIDEO_CLIPS
        value: "10"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: JWT_ALGORITHM
        value: "HS256"

      # Stripe redirect URLs — update after first deploy with real domain
      - key: STRIPE_SUCCESS_URL
        value: "https://bookbrief-web.onrender.com/frontend/dashboard.html?payment=success"
      - key: STRIPE_CANCEL_URL
        value: "https://bookbrief-web.onrender.com/frontend/dashboard.html?payment=cancelled"

      # CORS — set to your real frontend origin if serving separately
      - key: CORS_ORIGINS
        value: "https://bookbrief-web.onrender.com"
