      /* ── Reading typography ── */
      .bb-md {
        font-size: 1.0rem;
        line-height: 1.75;
        color: #292524;
      }
      .dark .bb-md { color: #e7e5e4; }

      .bb-md h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 1.5rem 0 .75rem;
        font-family: Literata, Georgia, serif;
        color: #1c1917;
        line-height: 1.25;

      .dark .bb-md h1 { color: #fafaf9; }

      .bb-md h2 {
        font-size: 1.3rem;
        font-weight: 650;
        margin: 2rem 0 .6rem;
        font-family: Literata, Georgia, serif;
        color: #292524;
        border-bottom: 1px solid #e7e5e4;
        padding-bottom: .4rem;
      }
      .dark .bb-md h2 { color: #f5f5f4; border-bottom-color: #44403c; }

      .bb-md h3 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 1.25rem 0 .4rem;
        color: #44403c;
      }
      .dark .bb-md h3 { color: #d6d3d1; }

      .bb-md p  { margin: .75rem 0; line-height: 1.75; }

      .bb-md ul, .bb-md ol {
        margin: .6rem 0 .6rem 0;
        padding-left: 1.5rem;
      }
      .bb-md li { margin: .4rem 0; line-height: 1.65; }
      .bb-md ul li::marker { color: #d97706; }

      .bb-md pre, .bb-md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: .875em;
      }
      .bb-md pre {
        overflow-x: auto;
        padding: .875rem 1.125rem;
        border-radius: .75rem;
        background: #f5f5f4;
        margin: 1rem 0;
        border: 1px solid #e7e5e4;
      }
      .dark .bb-md pre {
        background: #1c1917;
        border-color: #292524;
      }
      .bb-md code:not(pre code) {
        background: #fef3c7;
        border-radius: .25rem;
        padding: .1em .35em;
        color: #92400e;
        font-size: .875em;
      }
      .dark .bb-md code:not(pre code) {
        background: rgba(120, 53, 15, 0.25);
        color: #fde68a;
      }
      .bb-md blockquote {
        border-left: 3px solid #d97706;
        margin: 1rem 0;
        padding: .5rem 0 .5rem 1.25rem;
        color: #57534e;
        font-style: italic;
        background: rgba(251, 191, 36, 0.04);
        border-radius: 0 .5rem .5rem 0;
      }
      .dark .bb-md blockquote {
        color: #a8a29e;
        border-left-color: #d97706;
        background: rgba(120, 53, 15, 0.08);
      }
      .bb-md hr {
        border: none;
        border-top: 1px solid #e7e5e4;
        margin: 2rem 0;
      }
      .dark .bb-md hr { border-top-color: #292524; }

      /* Strong highlight */
      .bb-md strong { color: #1c1917; font-weight: 650; }
      .dark .bb-md strong { color: #fafaf9; }

      @keyframes bb-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
      .bb-pulse { animation: bb-pulse 1.5s ease-in-out infinite; }

      @media print {
        header, .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
        .bb-md { max-width: none !important; }
        .print-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* Content card glassmorphism */
      .content-card {
        background: rgba(255, 255, 255, 0.93);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(214, 211, 209, 0.6);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.5) inset,
          0 8px 32px -8px rgba(28,25,23,.1);
      }
      .dark .content-card {
        background: rgba(28, 25, 23, 0.82);
        border: 1px solid rgba(68, 64, 60, 0.5);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.04) inset,
          0 8px 32px -8px rgba(0,0,0,.5);
      }

      /* Action bar buttons */
      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: .375rem;
        border-radius: .625rem;
        border: 1px solid;
        padding: .5rem 1rem;
        font-size: .8125rem;
        font-weight: 500;
        transition: all .18s cubic-bezier(0.22, 1, 0.36, 1);
        cursor: pointer;
      }
      .action-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(28,25,23,.08);
      }
      .action-btn:active { transform: translateY(0); }

      /* Page in */
      .view-in {
        animation: viewIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes viewIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .view-in.delay-1 { animation-delay: 0.1s; }
      .view-in.delay-2 { animation-delay: 0.2s; }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (!window.BBAuth || !BBAuth.isLoggedIn()) {
          window.location.replace("/frontend/login.html");
          return;
        }

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        var errEl = document.getElementById("load-err");

        if (!id) {
          errEl.textContent = "Missing summary ID. Open a summary from your library.";
          errEl.classList.remove("hidden");
          return;
        }

        // ── Initial fetch ─────────────────────────────────────────────────────
        var data;
        try {
          data = await BBApi.summaries.get(id);
        } catch (e) {
          errEl.textContent = e.message || "Could not load summary.";
          errEl.classList.remove("hidden");
          return;
        }

        // ── If still in-progress, poll first ─────────────────────────────────
        if (data.status === "pending" || data.status === "processing") {
          var procPanel = document.getElementById("processing-panel");
          var procStatus = document.getElementById("processing-status");
          var procElapsed = document.getElementById("processing-elapsed");
          procPanel.classList.remove("hidden");

          var startedAt = Date.now();
          var elapsedTimer = setInterval(function () {
            var s = Math.round((Date.now() - startedAt) / 1000);
            procElapsed.textContent = "Elapsed: " + s + "s";
          }, 1000);

          var statusLabels = {
            pending: "Queued for processing…",
            processing: "Running the summarization pipeline…",
          };

          try {
            data = await BBApi.summaries.pollUntilDone(id, {
              onStatus: function (s) {
                procStatus.textContent = statusLabels[s] || s;
              },
              timeoutMs: 360000,
            });
          } catch (e) {
            clearInterval(elapsedTimer);
            procPanel.classList.add("hidden");
            errEl.textContent = e.message || "Summary generation failed.";
            errEl.classList.remove("hidden");
            return;
          }
          clearInterval(elapsedTimer);
          procPanel.classList.add("hidden");
        }

        // ── Render summary ────────────────────────────────────────────────────
        document.getElementById("summary-shell").classList.remove("hidden");

        var title = data.title || "Untitled summary";
        document.getElementById("sum-title").textContent = title;
        document.title = title + " — BookBrief AI";

        // Meta line
        var metaParts = [
          data.source_type,
          data.style,
          new Date(data.created_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }),
        ];
        if (data.author) metaParts.splice(1, 0, "by " + data.author);
        document.getElementById("sum-meta").textContent = metaParts.join(" · ");

        // Status badge
        var st = document.getElementById("sum-status");
        var badgeColors = {
          completed: { bg: "#166534", text: "#dcfce7" },
          failed:    { bg: "#991b1b", text: "#fee2e2" },
          processing:{ bg: "#92400e", text: "#fef3c7" },
          pending:   { bg: "#1e3a5f", text: "#dbeafe" },
        };
        var bc = badgeColors[data.status] || { bg: "#292524", text: "#f5f5f4" };
        st.style.background = bc.bg;
        st.style.color = bc.text;
        st.style.padding = ".2rem .625rem";
        st.style.borderRadius = "999px";
        st.textContent = data.status;

        // Warning banner for soft failures
        if (data.error_message) {
          document.getElementById("sum-warn-msg").textContent = data.error_message;
          document.getElementById("sum-warn").classList.remove("hidden");
        }

        // Render markdown
        var rawMd = data.output_markdown || "";
        var html;
        if (typeof marked !== "undefined" && marked.parse) {
          html = marked.parse(rawMd);
        } else {
          var d = document.createElement("div");
          d.textContent = rawMd;
          html = "<pre>" + d.innerHTML + "</pre>";
        }
        if (typeof DOMPurify !== "undefined") {
          html = DOMPurify.sanitize(html);
        }
        document.getElementById("md-content").innerHTML = html;

        // ── Action handlers ──────────────────────────────────────────────────
        document.getElementById("btn-copy").addEventListener("click", function () {
          BBUi.copyToClipboard(rawMd).then(
            function () { BBUi.showToast("Copied to clipboard!", "success"); },
            function () { BBUi.showToast("Copy failed — try selecting and copying manually.", "error"); }
          );
        });

        document.getElementById("btn-md").addEventListener("click", function () {
          var safe = (data.title || "summary").replace(/[^\w\-]+/g, "-").slice(0, 60);
          BBUi.downloadText(safe + ".md", rawMd);
          BBUi.showToast("Downloading " + safe + ".md", "success");
        });

        document.getElementById("btn-print").addEventListener("click", function () {
          window.print();
        });

        document.getElementById("btn-delete").addEventListener("click", async function () {
          if (!confirm("Delete this summary from your library? This cannot be undone.")) return;
          try {
            await BBApi.summaries.remove(id);
            BBUi.showToast("Summary deleted.", "info");
            setTimeout(function () {
              window.location.href = "/frontend/dashboard.html";
            }, 600);
          } catch (e) {
            BBUi.showToast(e.message || "Delete failed", "error");
          }
        });

        // ── Audio player ─────────────────────────────────────────────────────
        function openAudioPlayer(mode) {
          if (typeof BBAudioPlayer === "undefined") {
            BBUi.showToast("Audio player not available.", "error");
            return;
          }
          var listenTitle = data.title || "Summary";
          var listenMd = rawMd || "";
          BBAudioPlayer.init(id, listenTitle, listenMd, function () {
            // Player closed — nothing extra needed
          }, { startMode: mode });
        }

        document.getElementById("btn-audiobook").addEventListener("click", function () {
          openAudioPlayer("audiobook");
        });

        document.getElementById("btn-podcast").addEventListener("click", function () {
          openAudioPlayer("podcast");
        });

      });
    </script>

          // LEFT — spread vertically
          [-11.5,  7.0, -4.5], [-10.5,  3.5, -3.5], [-12.0,  0.0, -5.0],
          [-11.0, -3.5, -4.0], [-10.0, -7.0, -3.5], [-12.5,  5.5, -6.0],
          [-11.8, -5.5, -5.5], [-10.8,  1.8, -3.0],
          // RIGHT — spread vertically
          [ 11.5,  7.0, -4.5], [ 10.5,  3.5, -3.5], [ 12.0,  0.0, -5.0],
          [ 11.0, -3.5, -4.0], [ 10.0, -7.0, -3.5], [ 12.5,  5.5, -6.0],
          [ 11.8, -5.5, -5.5], [ 10.8,  1.8, -3.0],
        ];

        var BW=0.92, BH=1.38, BD=0.13;
        var loader = new THREE.TextureLoader();
        var books = [];

        bookData.forEach(function(bd, i){
          var pos = positions[i] || [0, 0, 0];
          var group = new THREE.Group();

          var geo  = new THREE.BoxGeometry(BW, BH, BD);
          var sM   = function(c){ return new THREE.MeshStandardMaterial({color:c,roughness:0.35,metalness:0.1}); };
          var mats = [sM(bd.spine),sM(bd.spine),sM(0x222222),sM(0x222222),sM(bd.cover),sM(bd.cover)];
          var mesh = new THREE.Mesh(geo, mats);

          loader.load('https://covers.openlibrary.org/b/isbn/'+bd.isbn+'-M.jpg', function(tex){
            tex.colorSpace = THREE.SRGBColorSpace;
            mesh.material[4] = new THREE.MeshStandardMaterial({map:tex,roughness:0.36,metalness:0.04});
          }, undefined, function(){
            group.visible = false;
          });

          group.add(mesh);
          group.position.set(pos[0], pos[1], pos[2]);
          group.rotation.y = (Math.random() - 0.5) * 0.8;
          group.rotation.z = (Math.random() - 0.5) * 0.1;
          scene.add(group);

          books.push({
            group:    group,
            baseY:    pos[1],
            floatSpd: 0.45 + Math.random() * 0.55,
            phase:    Math.random() * Math.PI * 2,
            rotSpd:   (Math.random() - 0.5) * 0.007,
          });
        });

        // ── Subtle particles ─────────────────────────────────────────────────
        var pGeo = new THREE.BufferGeometry();
        var N = 400, pPos = new Float32Array(N*3), pCol = new Float32Array(N*3);
        var pal = [[0.39,0.40,0.95],[0.66,0.33,0.97],[0.13,0.83,0.94],[0.96,0.44,0.71],[0.98,0.75,0.2]];
        for (var k = 0; k < N; k++){
          pPos[k*3]   = (Math.random()-0.5)*32;
          pPos[k*3+1] = (Math.random()-0.5)*26;
          pPos[k*3+2] = (Math.random()-0.5)*18 - 6;
          var c = pal[k % pal.length];
          pCol[k*3]=c[0]; pCol[k*3+1]=c[1]; pCol[k*3+2]=c[2];
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
        scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
          size:0.05, vertexColors:true, transparent:true, opacity:0.55
        })));

        // ── Mouse parallax ───────────────────────────────────────────────────
        var mX = 0, mY = 0;
        window.addEventListener('mousemove', function(e){
          mX = (e.clientX / innerWidth  - 0.5) * 2;
          mY = (e.clientY / innerHeight - 0.5) * 2;
        }, { passive:true });

        // ── Resize ───────────────────────────────────────────────────────────
        window.addEventListener('resize', function(){
          renderer.setSize(innerWidth, innerHeight, false);
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
        });

        // ── Animate ──────────────────────────────────────────────────────────
        var t = 0;
        (function animate(){
          requestAnimationFrame(animate);
          t += 0.011;
          // gentle camera drift + mouse parallax
          camera.position.x += (mX * 0.35 - camera.position.x) * 0.04;
          camera.position.y += (-mY * 0.25 - camera.position.y) * 0.04;
          camera.lookAt(0, 0, 0);
          books.forEach(function(b){
            b.group.position.y = b.baseY + Math.sin(t * b.floatSpd + b.phase) * 0.28;
            b.group.rotation.y += b.rotSpd;
          });
          renderer.render(scene, camera);
        })();
      })();
    </script>
  </body>
</html>
