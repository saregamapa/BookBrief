<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summary — BookBrief AI</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bookbrief-theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <style>
      .bb-md h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 1.25rem 0 0.75rem;
        font-family: Literata, Georgia, serif;
      }
      .bb-md h2 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 1.25rem 0 0.5rem;
        font-family: Literata, Georgia, serif;
      }
      .bb-md h3 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 1rem 0 0.35rem;
      }
      .bb-md p {
        margin: 0.65rem 0;
        line-height: 1.65;
      }
      .bb-md ul,
      .bb-md ol {
        margin: 0.5rem 0 0.5rem 1.25rem;
        padding-left: 0.25rem;
      }
      .bb-md li {
        margin: 0.25rem 0;
      }
      .bb-md pre,
      .bb-md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
      }
      .bb-md pre {
        overflow-x: auto;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgb(245 245 244);
        margin: 0.75rem 0;
      }
      .dark .bb-md pre {
        background: rgb(28 25 23);
      }
      .bb-md blockquote {
        border-left: 3px solid rgb(180 83 9);
        margin: 0.75rem 0;
        padding-left: 1rem;
        color: rgb(87 83 78);
      }
      .dark .bb-md blockquote {
        color: rgb(214 211 209);
      }
      @media print {
        header,
        .no-print {
          display: none !important;
        }
        body {
          background: white !important;
          color: black !important;
        }
        .bb-md {
          max-width: none !important;
        }
      }
    </style>
  </head>
  <body class="bb-paper min-h-screen text-stone-800 dark:bg-stone-950 dark:text-stone-100">
    <header class="no-print flex flex-wrap items-center justify-between gap-3 border-b border-stone-200 px-4 py-3 dark:border-stone-800 sm:px-6">
      <a href="/frontend/dashboard.html" class="font-serif-display text-lg font-semibold text-stone-900 dark:text-stone-50"
        >← Library</a
      >
      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          id="theme-toggle"
          class="bb-focus rounded-lg border border-stone-200 bg-white px-3 py-2 text-xs dark:border-stone-700 dark:bg-stone-900"
        >
          <span data-theme-label class="hidden sm:inline">Dark</span>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6">
      <p id="load-err" class="hidden text-sm text-red-600 dark:text-red-400"></p>

      <div id="summary-shell" class="hidden">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <h1 id="sum-title" class="font-serif-display text-2xl font-bold text-stone-900 dark:text-stone-50"></h1>
            <p id="sum-meta" class="mt-1 text-sm text-stone-500 dark:text-stone-400"></p>
          </div>
          <span
            id="sum-status"
            class="inline-flex shrink-0 rounded-full border border-stone-200 px-2.5 py-0.5 text-xs font-medium dark:border-stone-600"
          ></span>
        </div>

        <div class="no-print mt-6 flex flex-wrap gap-2">
          <button
            type="button"
            id="btn-copy"
            class="bb-focus rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-medium hover:bg-stone-50 dark:border-stone-600 dark:bg-stone-900 dark:hover:bg-stone-800"
          >
            Copy markdown
          </button>
          <button
            type="button"
            id="btn-md"
            class="bb-focus rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-medium hover:bg-stone-50 dark:border-stone-600 dark:bg-stone-900 dark:hover:bg-stone-800"
          >
            Download .md
          </button>
          <button
            type="button"
            id="btn-print"
            class="bb-focus rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-medium hover:bg-stone-50 dark:border-stone-600 dark:bg-stone-900 dark:hover:bg-stone-800"
          >
            Print / Save as PDF
          </button>
          <a
            href="/frontend/summarize.html"
            class="bb-focus inline-flex items-center rounded-lg bg-amber-800 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-900 dark:bg-amber-600"
            >New style</a
          >
          <button
            type="button"
            id="btn-delete"
            class="bb-focus rounded-lg border border-red-200 px-4 py-2 text-sm font-medium text-red-800 hover:bg-red-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950/50"
          >
            Delete
          </button>
        </div>

        <article
          id="md-wrap"
          class="mt-8 rounded-2xl border border-stone-200 bg-white/90 p-6 shadow-sm dark:border-stone-700 dark:bg-stone-900/60"
        >
          <div id="md-content" class="bb-md max-w-none"></div>
        </article>
      </div>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/ui.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        function escapeHtml(s) {
          var d = document.createElement("div");
          d.textContent = s == null ? "" : String(s);
          return d.innerHTML;
        }

        if (!window.BBAuth || !BBAuth.isLoggedIn()) {
          window.location.replace("/frontend/login.html");
          return;
        }
        BBUi.initThemeToggle("#theme-toggle");

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        var errEl = document.getElementById("load-err");
        if (!id) {
          errEl.textContent = "Missing summary id. Open a summary from your library.";
          errEl.classList.remove("hidden");
          return;
        }

        var data;
        try {
          data = await BBApi.summaries.get(id);
        } catch (e) {
          errEl.textContent = e.message || "Could not load summary.";
          errEl.classList.remove("hidden");
          return;
        }

        document.getElementById("summary-shell").classList.remove("hidden");
        var title = data.title || "Untitled summary";
        document.getElementById("sum-title").textContent = title;
        document.title = title + " — BookBrief AI";

        var metaParts = [data.source_type, data.style, new Date(data.created_at).toLocaleString()];
        if (data.author) metaParts.splice(1, 0, "by " + data.author);
        document.getElementById("sum-meta").textContent = metaParts.join(" · ");

        var st = document.getElementById("sum-status");
        st.textContent = data.status;
        if (data.status === "failed" || (data.error_message && data.error_message.length)) {
          st.classList.add("border-red-300", "text-red-800", "dark:border-red-800", "dark:text-red-300");
        }

        if (data.error_message) {
          var warn = document.createElement("p");
          warn.className =
            "no-print mb-4 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-950 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-100";
          warn.textContent = data.error_message;
          document.getElementById("summary-shell").insertBefore(warn, document.getElementById("md-wrap"));
        }

        var rawMd = data.output_markdown || "";
        var html =
          typeof marked !== "undefined" && marked.parse
            ? marked.parse(rawMd)
            : "<pre>" + escapeHtml(rawMd) + "</pre>";
        if (typeof DOMPurify !== "undefined") {
          html = DOMPurify.sanitize(html);
        }
        document.getElementById("md-content").innerHTML = html;

        document.getElementById("btn-copy").addEventListener("click", function () {
          BBUi.copyToClipboard(rawMd).then(
            function () {
              var b = document.getElementById("btn-copy");
              var t = b.textContent;
              b.textContent = "Copied!";
              setTimeout(function () {
                b.textContent = t;
              }, 1600);
            },
            function () {
              alert("Copy failed");
            }
          );
        });

        document.getElementById("btn-md").addEventListener("click", function () {
          var safe = (data.title || "summary").replace(/[^\w\-]+/g, "-").slice(0, 60);
          BBUi.downloadText(safe + ".md", rawMd);
        });

        document.getElementById("btn-print").addEventListener("click", function () {
          window.print();
        });

        document.getElementById("btn-delete").addEventListener("click", async function () {
          if (!confirm("Delete this summary from your library?")) return;
          try {
            await BBApi.summaries.remove(id);
            window.location.href = "/frontend/dashboard.html";
          } catch (e) {
            alert(e.message || "Delete failed");
          }
        });
      });
    </script>
  </body>
</html>
