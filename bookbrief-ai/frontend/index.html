    <style>
      /* ── Base ── */
      html { background:#07070f; scroll-behavior:smooth; }
      body { background:#07070f; color:#e2e8f0; overflow-x:hidden; }
      body::after {
        content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
        background:
          radial-gradient(ellipse 70% 60% at 20% 50%, rgba(99,102,241,0.07) 0%,transparent 55%),
          radial-gradient(ellipse 60% 70% at 80% 20%, rgba(168,85,247,0.06) 0%,transparent 55%),
          radial-gradient(ellipse 50% 50% at 55% 80%, rgba(34,211,238,0.04) 0%,transparent 55%);
      }
      /* subtle dot grid */
      body::before {
        content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
        background-image:radial-gradient(rgba(99,102,241,0.06) 1px,transparent 1px);
        background-size:44px 44px;
      }

      /* ── Canvas ── */
      #hero-canvas { position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0; }

      /* ── Hero ── */
      #hero-section { position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden; }
      #hero-overlay {
        position:absolute;inset:0;z-index:1;pointer-events:none;
        background:
          radial-gradient(ellipse 58% 55% at 50% 44%,rgba(7,7,15,0.35) 0%,rgba(7,7,15,0.78) 100%),
          radial-gradient(ellipse 100% 28% at 50% 100%,rgba(7,7,15,0.98) 0%,transparent 100%),
          radial-gradient(ellipse 26% 75% at 0% 50%,rgba(7,7,15,0.55) 0%,transparent 55%),
          radial-gradient(ellipse 26% 75% at 100% 50%,rgba(7,7,15,0.5) 0%,transparent 55%);
      }

      /* ── Orbs ── */
      .hero-orb { position:absolute;border-radius:50%;pointer-events:none;z-index:1;filter:blur(90px); }
      .hero-orb-indigo {
        width:520px;height:520px;top:2%;left:44%;transform:translateX(-50%);
        background:radial-gradient(circle,rgba(99,102,241,0.28) 0%,transparent 70%);
        animation:orb-drift 9s ease-in-out infinite;
      }
      .hero-orb-purple {
        width:380px;height:380px;top:18%;right:4%;
        background:radial-gradient(circle,rgba(168,85,247,0.2) 0%,transparent 70%);
        animation:orb-drift 12s ease-in-out infinite 2s;
      }
      .hero-orb-cyan {
        width:300px;height:300px;top:14%;left:4%;
        background:radial-gradient(circle,rgba(34,211,238,0.14) 0%,transparent 70%);
        animation:orb-drift 14s ease-in-out infinite 5s;
      }
      .hero-orb-pink {
        width:260px;height:260px;bottom:22%;right:12%;
        background:radial-gradient(circle,rgba(244,114,182,0.12) 0%,transparent 70%);
        animation:orb-drift 10s ease-in-out infinite 7s;
      }
      @keyframes orb-drift {
        0%,100%{transform:translateY(0) scale(1);}
        50%{transform:translateY(-24px) scale(1.07);}
      }
      .hero-orb-indigo { transform-origin:center; }

      #hero-content,#hero-stats { position:relative;z-index:2; }

      /* ── Graffiti ── */
      .graffiti-container { position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0; }
      .graffiti-word {
        position:absolute;font-family:"Impact","Arial Black",sans-serif;font-weight:900;
        text-transform:uppercase;color:rgba(255,255,255,0.016);pointer-events:none;
        user-select:none;line-height:0.88;letter-spacing:-0.02em;
      }

      /* ── Badge ── */
      .bb-badge {
        display:inline-flex;align-items:center;gap:0.5rem;padding:0.3rem 1.1rem;
        border-radius:9999px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;
        border:1px solid rgba(99,102,241,0.45);background:rgba(99,102,241,0.1);color:#a5b4fc;
        backdrop-filter:blur(8px);
      }
      .bb-pulse { animation:pulse-dot 2s ease-in-out infinite; }
      @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.6)} }

      /* ── Gradient text ── */
      .text-gradient {
        background:linear-gradient(135deg,#818cf8 0%,#c084fc 45%,#22d3ee 100%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      }
      .text-gradient-warm {
        background:linear-gradient(135deg,#f59e0b 0%,#f43f5e 55%,#a855f7 100%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      }

      /* ── CTA button ── */
      .bb-cta-primary {
        position:relative;overflow:hidden;
        background:linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#22d3ee 100%);
        background-size:200% 200%;animation:grad-shift 4s ease infinite;
        box-shadow:0 0 32px rgba(99,102,241,0.45),0 0 64px rgba(168,85,247,0.2);
        transition:box-shadow 0.3s ease,transform 0.3s ease;
      }
      .bb-cta-primary:hover {
        box-shadow:0 0 50px rgba(99,102,241,0.65),0 0 90px rgba(168,85,247,0.32);
        transform:translateY(-2px);
      }
      .bb-cta-primary::after {
        content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);
        transform:skewX(-15deg);animation:shimmer 3s infinite 1s;
      }
      .bb-cta-secondary {
        background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.13);
        color:#e2e8f0;backdrop-filter:blur(8px);
        transition:background 0.3s ease,border-color 0.3s ease,box-shadow 0.3s ease;
      }
      .bb-cta-secondary:hover {
        background:rgba(99,102,241,0.1);border-color:rgba(99,102,241,0.45);
        box-shadow:0 0 24px rgba(99,102,241,0.18);
      }
      @keyframes grad-shift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
      @keyframes shimmer { 0%{left:-100%} 100%{left:200%} }

      /* ── Ripple ── */
      .ripple-btn { position:relative;overflow:hidden; }
      .ripple-btn .ripple {
        position:absolute;border-radius:50%;background:rgba(255,255,255,0.28);
        transform:scale(0);animation:ripple-anim 0.65s linear;pointer-events:none;
      }
      @keyframes ripple-anim { to { transform:scale(4);opacity:0; } }

      /* ── Scroll hint ── */
      @keyframes scroll-bounce { 0%,100%{transform:translateY(0);opacity:0.35} 50%{transform:translateY(9px);opacity:0.85} }
      .bb-scroll-hint { animation:scroll-bounce 2.5s ease-in-out infinite; }

      /* ── Stat numbers ── */
      .stat-num {
        font-family:Georgia,serif;font-size:2.4rem;font-weight:800;
        background:linear-gradient(135deg,#818cf8,#c084fc);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      }

      /* ── Glass cards ── */
      .glass-card {
        background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
        border:1px solid rgba(255,255,255,0.07);border-radius:1.5rem;
        transition:all 0.38s ease;
      }
      .glass-card:hover {
        background:rgba(255,255,255,0.055);border-color:rgba(99,102,241,0.32);
        box-shadow:0 0 48px rgba(99,102,241,0.12),0 20px 60px rgba(0,0,0,0.35);
        transform:translateY(-5px);
      }
      .glass-card-dark {
        background:rgba(13,12,30,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
        border:1px solid rgba(99,102,241,0.14);border-radius:1.5rem;
        transition:all 0.38s ease;
      }
      .glass-card-dark:hover {
        border-color:rgba(99,102,241,0.38);
        box-shadow:0 0 60px rgba(99,102,241,0.14),inset 0 1px 0 rgba(255,255,255,0.05);
        transform:translateY(-5px);
      }

      /* ── Icon boxes ── */
      .icon-box-indigo { background:linear-gradient(135deg,rgba(99,102,241,0.18),rgba(99,102,241,0.06));border:1px solid rgba(99,102,241,0.28);box-shadow:0 0 22px rgba(99,102,241,0.12); }
      .icon-box-purple { background:linear-gradient(135deg,rgba(168,85,247,0.18),rgba(168,85,247,0.06));border:1px solid rgba(168,85,247,0.28);box-shadow:0 0 22px rgba(168,85,247,0.12); }
      .icon-box-cyan   { background:linear-gradient(135deg,rgba(34,211,238,0.15),rgba(34,211,238,0.05));border:1px solid rgba(34,211,238,0.22);box-shadow:0 0 22px rgba(34,211,238,0.1); }
      .icon-box-emerald{ background:linear-gradient(135deg,rgba(52,211,153,0.15),rgba(52,211,153,0.05));border:1px solid rgba(52,211,153,0.22);box-shadow:0 0 22px rgba(52,211,153,0.1); }
      .icon-box-pink   { background:linear-gradient(135deg,rgba(244,114,182,0.15),rgba(244,114,182,0.05));border:1px solid rgba(244,114,182,0.22);box-shadow:0 0 22px rgba(244,114,182,0.1); }
      .icon-box-amber  { background:linear-gradient(135deg,rgba(251,191,36,0.15),rgba(251,191,36,0.05));border:1px solid rgba(251,191,36,0.22);box-shadow:0 0 22px rgba(251,191,36,0.1); }
      .feat-icon { transition:transform 0.3s ease; }
      .glass-card:hover .feat-icon, .glass-card-dark:hover .feat-icon { transform:scale(1.16) rotate(-4deg); }

      /* ── Glowing divider ── */
      .glow-divider {
        height:1px;
        background:linear-gradient(90deg,transparent,rgba(99,102,241,0.5),rgba(168,85,247,0.5),rgba(34,211,238,0.3),transparent);
        box-shadow:0 0 10px rgba(99,102,241,0.3);
      }

      /* ── Section line ── */
      .section-line {
        width:58px;height:2px;border-radius:9999px;margin:0.8rem auto 0;
        background:linear-gradient(90deg,#6366f1,#a855f7,#22d3ee);
        box-shadow:0 0 12px rgba(99,102,241,0.55);
      }

      /* ── Benefit pills ── */
      .benefit-pill {
        display:inline-flex;align-items:center;gap:0.5rem;padding:0.4rem 1rem;
        border-radius:9999px;font-size:0.78rem;font-weight:600;
        background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.22);
        color:#c7d2fe;backdrop-filter:blur(6px);transition:all 0.22s ease;
      }
      .benefit-pill:hover { background:rgba(99,102,241,0.16);border-color:rgba(99,102,241,0.45); }

      /* ── Preview card ── */
      .preview-card {
        background:rgba(13,10,32,0.9);border:1px solid rgba(99,102,241,0.22);border-radius:1.5rem;
        box-shadow:0 0 60px rgba(99,102,241,0.16),0 30px 80px rgba(0,0,0,0.45);overflow:hidden;
      }
      .preview-header {
        background:linear-gradient(135deg,rgba(99,102,241,0.35),rgba(168,85,247,0.22));
        border-bottom:1px solid rgba(99,102,241,0.22);
        padding:0.85rem 1.4rem;display:flex;align-items:center;gap:0.75rem;
      }

      /* ── Testimonials ── */
      .bb-testimonial { position:relative;overflow:hidden;transition:all 0.38s ease; }
      .bb-testimonial::before {
        content:'\201C';position:absolute;top:-12px;right:14px;font-size:7rem;
        font-family:Georgia,serif;line-height:1;color:rgba(99,102,241,0.13);pointer-events:none;
      }
      .bb-testimonial:hover { transform:translateY(-5px); }

      /* ── Pricing ── */
      .price-popular {
        background:linear-gradient(160deg,rgba(99,102,241,0.16) 0%,rgba(168,85,247,0.09) 100%);
        border:1px solid rgba(99,102,241,0.42);
        box-shadow:0 0 60px rgba(99,102,241,0.2),inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* ── FAQ ── */
      details.faq-item summary { list-style:none;cursor:pointer; }
      details.faq-item summary::-webkit-details-marker { display:none; }
      details.faq-item .faq-icon { transition:transform 0.25s ease; }
      details.faq-item[open] .faq-icon { transform:rotate(45deg); }

      /* ── CTA section ── */
      .cta-wrap {
        background:linear-gradient(135deg,#1a0533 0%,#0d0820 35%,#060d24 65%,#0a1a3a 100%);
        position:relative;overflow:hidden;
      }
      .cta-wrap::before {
        content:"";position:absolute;inset:0;pointer-events:none;
        background:
          radial-gradient(ellipse 70% 65% at 30% 50%,rgba(99,102,241,0.22) 0%,transparent 60%),
          radial-gradient(ellipse 60% 70% at 80% 40%,rgba(168,85,247,0.16) 0%,transparent 60%),
          radial-gradient(ellipse 50% 50% at 50% 90%,rgba(34,211,238,0.09) 0%,transparent 60%);
      }
      #cta-particles { position:absolute;inset:0;overflow:hidden;pointer-events:none; }
      .cta-particle {
        position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(99,102,241,0.75);
        animation:float-gentle var(--dur,6s) ease-in-out infinite;animation-delay:var(--del,0s);
      }
      @keyframes float-gentle {
        0%,100%{transform:translateY(0) rotate(0deg);opacity:0.5;}
        50%{transform:translateY(-28px) rotate(180deg);opacity:1;}
      }

      /* ── Header ── */
      .site-header {
        background:rgba(7,7,15,0.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
        border-bottom:1px solid rgba(255,255,255,0.06);
        box-shadow:0 1px 32px rgba(0,0,0,0.45);
      }

      /* ── Footer ── */
      .site-footer { background:linear-gradient(180deg,#0a0a18 0%,#07070f 100%); }

      /* ── Mobile ── */
      @media (max-width:640px) {
        #hero-canvas { display:none; }
        #hero-overlay { background:rgba(7,7,15,0.4); }
      }

      /* ── Scroll reveal ── */
      .bb-reveal { opacity:0;transform:translateY(26px);transition:opacity 0.65s ease,transform 0.65s ease; }
      .bb-reveal.bb-visible { opacity:1;transform:translateY(0); }

      /* ── Step numbers ── */
      .step-num {
        font-size:5rem;font-weight:900;font-family:Georgia,serif;line-height:1;letter-spacing:-0.04em;
        background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.12));
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      }
    </style>
  </head>

    <script src="/frontend/js/ui.js"><\/script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Mobile nav
        if (window.BBUi) BBUi.wireMobileNav("#nav-toggle", "#mobile-nav");

        // Scroll reveal
        var obs = new IntersectionObserver(function(entries){
          entries.forEach(function(e){ if(e.isIntersecting){e.target.classList.add("bb-visible");obs.unobserve(e.target);} });
        }, { threshold:0.08, rootMargin:"0px 0px -30px 0px" });
        document.querySelectorAll(".bb-reveal").forEach(function(el){ obs.observe(el); });

        // CTA particles
        var ctaP = document.getElementById("cta-particles");
        if (ctaP) {
          var colors = ["rgba(99,102,241,0.8)","rgba(168,85,247,0.7)","rgba(34,211,238,0.6)","rgba(244,114,182,0.5)"];
          for (var i = 0; i < 30; i++) {
            var p = document.createElement("div");
            p.className = "cta-particle";
            p.style.cssText = "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;"
              +"--dur:"+(4+Math.random()*7)+"s;--del:"+(-Math.random()*7)+"s;"
              +"background:"+colors[Math.floor(Math.random()*colors.length)]+";";
            ctaP.appendChild(p);
          }
        }

        // Ripple effect on .ripple-btn
        document.querySelectorAll(".ripple-btn").forEach(function(btn){
          btn.addEventListener("click", function(e){
            var r = document.createElement("span");
            r.className = "ripple";
            var rect = btn.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            r.style.cssText = "width:"+size+"px;height:"+size+"px;"
              +"left:"+(e.clientX-rect.left-size/2)+"px;"
              +"top:"+(e.clientY-rect.top-size/2)+"px;";
            btn.appendChild(r);
            setTimeout(function(){ r.remove(); }, 700);
          });
        });

        // Hero stagger animation (pure CSS fallback if GSAP not loaded)
        var heroEls = document.querySelectorAll(".hero-anim");
        heroEls.forEach(function(el,i){
          el.style.opacity = "0";
          el.style.transform = "translateY(32px)";
          el.style.transition = "opacity 0.7s ease, transform 0.7s ease";
          el.style.transitionDelay = (i * 0.14) + "s";
          setTimeout(function(){ el.style.opacity="1"; el.style.transform="translateY(0)"; }, 80);
        });
      });
    <\/script>

    <!-- ── Three.js — 28 neon-lit books (dark theme) ── -->
    <script type="module">
      import * as THREE from "three";
      const canvas = document.getElementById("hero-canvas");
      if (!canvas || window.innerWidth < 640) { if(canvas) canvas.style.display="none"; return; }

      const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 120);
      camera.position.set(0, 0, 12);

      // ── Dark-theme lighting: neon rim lights ──
      scene.add(new THREE.AmbientLight(0x1a1040, 0.6));

      const rimTop = new THREE.DirectionalLight(0x6366f1, 1.8);
      rimTop.position.set(0, 10, 5); scene.add(rimTop);

      const rimL = new THREE.PointLight(0xa855f7, 2.0, 50);
      rimL.position.set(-9, 4, 7); scene.add(rimL);

      const rimR = new THREE.PointLight(0x22d3ee, 1.4, 45);
      rimR.position.set(9, -2, 7); scene.add(rimR);

      const rimPink = new THREE.PointLight(0xf472b6, 1.0, 40);
      rimPink.position.set(0, -8, 6); scene.add(rimPink);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(3, 6, 8); scene.add(keyLight);

      // ── 28 books ──
      const bookData = [
        { isbn:"9780735211292", spine:0xe85d04, cover:0xfaa307 },
        { isbn:"9780062316097", spine:0x0077b6, cover:0x023e8a },
        { isbn:"9780441013593", spine:0xd62828, cover:0xa4161a },
        { isbn:"9780061122415", spine:0xffb703, cover:0xfb8500 },
        { isbn:"9780451524935", spine:0x2d6a4f, cover:0x1b4332 },
        { isbn:"9780807014271", spine:0x9b5de5, cover:0x5a189a },
        { isbn:"9780857197689", spine:0x06a77d, cover:0x028090 },
        { isbn:"9780399590504", spine:0xf72585, cover:0xb5179e },
        { isbn:"9781612680194", spine:0xe63946, cover:0xc1121f },
        { isbn:"9781455586691", spine:0x4361ee, cover:0x3a0ca3 },
        { isbn:"9780062457714", spine:0x80b918, cover:0x55a630 },
        { isbn:"9780399594793", spine:0xe040fb, cover:0x9c27b0 },
        { isbn:"9780525559474", spine:0x0096c7, cover:0x0077b6 },
        { isbn:"9781847941831", spine:0xff6b6b, cover:0xee9b00 },
        { isbn:"9780062316110", spine:0x3a86ff, cover:0x023e8a },
        { isbn:"9780385737951", spine:0xf4a261, cover:0xe76f51 },
        { isbn:"9780316346627", spine:0x8338ec, cover:0x5f0f40 },
        { isbn:"9780062991539", spine:0x2dc653, cover:0x136f63 },
        { isbn:"9780525521143", spine:0xff006e, cover:0xc9184a },
        { isbn:"9780385549103", spine:0x4cc9f0, cover:0x4361ee },
        { isbn:"9780593139134", spine:0xffca3a, cover:0xd4a017 },
        { isbn:"9780062316103", spine:0x6a994e, cover:0x386641 },
        { isbn:"9780385490818", spine:0xff595e, cover:0xc1121f },
        { isbn:"9780735224292", spine:0x48cae4, cover:0x023e8a },
        { isbn:"9780593135204", spine:0xffd60a, cover:0xfca311 },
        { isbn:"9780525523000", spine:0xef476f, cover:0xb5179e },
        { isbn:"9780525512400", spine:0x06d6a0, cover:0x0cb09e },
        { isbn:"9780316769174", spine:0xff7f11, cover:0xd4380d },
      ];

      const positions = [
        [-9.5,9.5,-3.5],[-6.0,10.5,-2.5],[-3.5,7.8,-2.0],[3.5,8.2,-2.0],[6.5,11.0,-3.0],[9.8,9.0,-3.5],
        [-10.5,4.5,-4.0],[-7.2,3.2,-2.0],[-4.5,5.0,-1.5],[-2.0,3.8,-3.5],[2.2,4.2,-3.5],[4.8,5.5,-1.5],[7.5,3.5,-2.0],[10.5,4.8,-4.0],
        [-10.0,0.5,-3.0],[-7.5,-1.5,-2.5],[-5.0,1.5,-1.5],[5.0,-1.2,-1.5],[7.8,1.0,-2.5],[10.2,-0.5,-3.0],
        [-9.5,-4.5,-3.5],[-6.5,-3.0,-2.0],[-3.5,-5.0,-2.5],[3.8,-5.5,-2.5],[6.8,-3.5,-2.0],[9.5,-4.0,-3.5],
        [-7.5,-9.0,-3.0],[7.5,-8.5,-3.0],
      ];

      const textureLoader = new THREE.TextureLoader();
      const books = [];
      const BW=0.85, BH=1.25, BD=0.14;
      const spineMat = (col) => new THREE.MeshStandardMaterial({ color:col, roughness:0.35, metalness:0.12 });
      const coverMat = (col) => new THREE.MeshStandardMaterial({ color:col, roughness:0.4,  metalness:0.05 });

      bookData.forEach(function(bd, i){
        var pos = positions[i] || [0,0,0];
        var group = new THREE.Group();

        var geo = new THREE.BoxGeometry(BW, BH, BD);
        var mats = [
          spineMat(bd.spine), spineMat(bd.spine),
          spineMat(0x111111),  spineMat(0x111111),
          coverMat(bd.cover),  coverMat(bd.cover),
        ];
        var mesh = new THREE.Mesh(geo, mats);

        textureLoader.load(
          "https://covers.openlibrary.org/b/isbn/"+bd.isbn+"-M.jpg",
          function(tex){
            tex.colorSpace = THREE.SRGBColorSpace;
            mesh.material[4] = new THREE.MeshStandardMaterial({ map:tex, roughness:0.38, metalness:0.04 });
          }
        );

        group.add(mesh);
        group.position.set(pos[0], pos[1], pos[2]);
        group.rotation.y = (Math.random()-0.5)*0.7;
        group.rotation.z = (Math.random()-0.5)*0.12;
        scene.add(group);
        books.push({ group, baseY:pos[1], speed:0.55+Math.random()*0.55, phase:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.008 });
      });

      // Multi-colour particles
      var pGeo = new THREE.BufferGeometry();
      var N = 700, pPos = new Float32Array(N*3), pCol = new Float32Array(N*3);
      var pal = [[0.39,0.40,0.95],[0.66,0.33,0.97],[0.13,0.83,0.94],[0.96,0.44,0.71],[1.0,0.79,0.16]];
      for(var k=0;k<N;k++){
        pPos[k*3]=(Math.random()-0.5)*30;
        pPos[k*3+1]=(Math.random()-0.5)*30;
        pPos[k*3+2]=(Math.random()-0.5)*20-5;
        var c=pal[k%pal.length];
        pCol[k*3]=c[0];pCol[k*3+1]=c[1];pCol[k*3+2]=c[2];
      }
      pGeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
      pGeo.setAttribute("color",new THREE.BufferAttribute(pCol,3));
      scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.055,vertexColors:true,transparent:true,opacity:0.75})));

      // Scroll camera
      var scrollY=0, targetScrollCamY=0, currentScrollCamY=0;
      window.addEventListener("scroll",function(){
        scrollY=window.scrollY;
        var maxS=Math.max(document.body.scrollHeight-window.innerHeight,1);
        targetScrollCamY=-(scrollY/maxS)*14;
      },{passive:true});

      // Mouse
      var mouseX=0, mouseY=0;
      window.addEventListener("mousemove",function(e){
        mouseX=(e.clientX/window.innerWidth-0.5)*2;
        mouseY=(e.clientY/window.innerHeight-0.5)*2;
      },{passive:true});

      window.addEventListener("resize",function(){
        camera.aspect=window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
      });

      var t=0;
      function animate(){
        requestAnimationFrame(animate);
        t+=0.012;
        currentScrollCamY+=(targetScrollCamY-currentScrollCamY)*0.055;
        camera.position.x=Math.sin(t*0.07)*0.35+mouseX*0.22;
        camera.position.y=Math.cos(t*0.09)*0.4-mouseY*0.18+currentScrollCamY;
        camera.lookAt(0,currentScrollCamY,0);
        books.forEach(function(b){
          b.group.position.y=b.baseY+Math.sin(t*b.speed+b.phase)*0.32;
          b.group.rotation.y+=b.rotSpeed;
        });
        renderer.render(scene,camera);
      }
      animate();
    <\/script>
  </body>
